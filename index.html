<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>To-Do</h1>
    <label class="search">
      <span class="sr-only">Search tasks</span>
      <input id="search" type="search" placeholder="Search tasks, notes, tags…" autocomplete="off">
    </label>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Filters and lists">
      <section>
        <h2>Show</h2>
        <ul id="status-filters" class="nav-list"></ul>
      </section>
      <section>
        <h2>Lists</h2>
        <ul id="list-nav" class="nav-list"></ul>
        <form id="list-form" class="inline-form">
          <label class="sr-only" for="list-name">New list name</label>
          <input id="list-name" placeholder="New list" maxlength="40" autocomplete="off">
          <button type="submit">Add</button>
        </form>
      </section>
      <section>
        <h2>Tags</h2>
        <div id="tag-nav" class="tags"></div>
      </section>
      <section class="backup">
        <h2>Backup</h2>
        <button type="button" id="export-btn">Export JSON</button>
        <button type="button" id="import-btn">Import JSON</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </section>
    </nav>

    <main>
      <form id="task-form" class="task-form">
        <h2 id="form-title" class="sr-only">Add task</h2>
        <div class="row">
          <label class="grow">
            <span class="sr-only">Task title</span>
            <input id="title" placeholder="What needs doing?" required maxlength="200" autocomplete="off">
          </label>
          <button type="submit" id="submit-btn">Add task</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
        <div class="row opts">
          <label>Due <input id="due" type="date"></label>
          <label>Priority
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>List <select id="list"></select></label>
          <label class="grow">Tags <input id="tags" placeholder="comma, separated" autocomplete="off"></label>
        </div>
        <label>Notes <textarea id="notes" rows="2"></textarea></label>
      </form>

      <div class="toolbar">
        <span id="count" aria-live="polite"></span>
        <label>Sort
          <select id="sort">
            <option value="created">Newest</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
          </select>
        </label>
        <button type="button" id="clear-done">Clear completed</button>
      </div>

      <p id="message" class="message" role="status" hidden></p>
      <ul id="tasks" class="tasks"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
