<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>To-Do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand"><span class="logo" aria-hidden="true">✓</span> To-Do</div>
      <button type="button" id="create-btn" class="btn primary create">+ Create</button>

      <nav>
        <section>
          <h2>Show</h2>
          <ul id="status-filters" class="nav-list"></ul>
        </section>
        <section>
          <h2>Lists</h2>
          <ul id="list-nav" class="nav-list"></ul>
          <form id="list-form" class="inline-form">
            <label class="sr-only" for="list-name">New list name</label>
            <input id="list-name" placeholder="New list" maxlength="40" autocomplete="off">
            <button type="submit" class="btn">Add</button>
          </form>
        </section>
        <section>
          <h2>Tags</h2>
          <div id="tag-nav" class="tags"></div>
        </section>
        <section>
          <h2>Backup</h2>
          <div class="backup">
            <button type="button" id="export-btn" class="btn">Export</button>
            <button type="button" id="import-btn" class="btn">Import</button>
          </div>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </section>
      </nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <label class="search">
          <span class="sr-only">Search tasks</span>
          <input id="search" type="search" placeholder="Search tasks, notes, tags…" autocomplete="off">
        </label>
      </header>

      <main>
        <div class="page-head">
          <h1 id="page-title">All tasks</h1>
          <div class="tabs" role="tablist" aria-label="View">
            <button type="button" role="tab" id="tab-list" aria-selected="true" aria-controls="list-view">List</button>
            <button type="button" role="tab" id="tab-board" aria-selected="false" aria-controls="board-view">Board</button>
          </div>
        </div>

        <div class="toolbar">
          <span id="count" aria-live="polite"></span>
          <label>Sort
            <select id="sort">
              <option value="created">Newest</option>
              <option value="due">Due date</option>
              <option value="priority">Priority</option>
            </select>
          </label>
          <button type="button" id="clear-done" class="btn">Clear completed</button>
        </div>

        <p id="message" class="message" role="status" hidden></p>

        <section id="list-view" role="tabpanel" aria-labelledby="tab-list"></section>
        <section id="board-view" class="board" role="tabpanel" aria-labelledby="tab-board" hidden></section>
        <p id="empty" class="empty" hidden>No tasks match. Use <strong>Create</strong> to add one.</p>
      </main>
    </div>
  </div>

  <dialog id="task-dialog" aria-labelledby="dlg-title">
    <form id="task-form">
      <h2 id="dlg-title">Create task</h2>
      <label>Title
        <input id="title" required maxlength="200" autocomplete="off" placeholder="What needs doing?">
      </label>
      <div class="grid2">
        <label>Status
          <select id="status">
            <option value="todo">To do</option>
            <option value="doing">Doing</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>Priority
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>Due date <input id="due" type="date"></label>
        <label>List <select id="list"></select></label>
      </div>
      <label>Tags <input id="tags" placeholder="comma, separated" autocomplete="off"></label>
      <label>Notes <textarea id="notes" rows="3"></textarea></label>
      <p id="dialog-error" class="message" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="submit-btn" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
